<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>災害影像分割 AI 系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: inline-block;
            padding: 20px 40px;
            background: white;
            border: 3px dashed #667eea;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }

        .file-input-label:hover {
            background: #e8e8ff;
            border-color: #764ba2;
            transform: translateY(-2px);
        }

        .preview-section {
            margin: 20px 0;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .analyze-btn {
            padding: 15px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
            margin-top: 30px;
        }

        .results-section.active {
            display: block;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .result-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
        }

        .result-card h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .result-image {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .disaster-list {
            list-style: none;
        }

        .disaster-item {
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .disaster-item .type {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .disaster-item .details {
            margin-top: 5px;
            color: #666;
        }

        .color-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
        }

        .legend {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .legend h4 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛰️ 災害影像分割 AI 系統</h1>
            <p>上傳衛星圖片，AI 自動標記災害區域</p>
        </div>

        <div class="content">
            <!-- 上傳區域 -->
            <div class="upload-section">
                <h2>📤 上傳衛星圖片</h2>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept="image/*">
                    <label for="fileInput" class="file-input-label">
                        📁 點擊選擇圖片
                    </label>
                </div>
                
                <div class="preview-section" id="previewSection" style="display: none;">
                    <h3>原始圖片預覽：</h3>
                    <img id="previewImage" class="preview-image" alt="預覽">
                </div>

                <button id="analyzeBtn" class="analyze-btn" disabled>
                    🤖 開始 AI 分析
                </button>
            </div>

            <!-- 載入中 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <h3>AI 正在分析圖片...</h3>
                <p>請稍候，這可能需要幾秒鐘</p>
            </div>

            <!-- 結果區域 -->
            <div class="results-section" id="resultsSection">
                <h2 style="color: #667eea; margin-bottom: 20px;">📊 AI 分析結果</h2>
                
                <div class="results-grid">
                    <!-- 分割結果圖 -->
                    <div class="result-card">
                        <h3>🎨 災害標記圖</h3>
                        <img id="segmentedImage" class="result-image" alt="分割結果">
                    </div>

                    <!-- 災害區域列表 -->
                    <div class="result-card">
                        <h3>📋 檢測到的災害區域</h3>
                        <ul class="disaster-list" id="disasterList"></ul>
                    </div>
                </div>

                <!-- 圖例 -->
                <div class="legend">
                    <h4>🎨 顏色圖例</h4>
                    <div class="legend-item">
                        <span class="color-indicator" style="background: blue;"></span>
                        <span>藍色 = 淹水區域</span>
                    </div>
                    <div class="legend-item">
                        <span class="color-indicator" style="background: red;"></span>
                        <span>紅色 = 建築受損</span>
                    </div>
                    <div class="legend-item">
                        <span class="color-indicator" style="background: yellow;"></span>
                        <span>黃色 = 植被破壞</span>
                    </div>
                    <div class="legend-item">
                        <span class="color-indicator" style="background: orange;"></span>
                        <span>橙色 = 道路阻斷</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const resultsSection = document.getElementById('resultsSection');
        const segmentedImage = document.getElementById('segmentedImage');
        const disasterList = document.getElementById('disasterList');

        let selectedFile = null;

        // 文件選擇
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                
                // 顯示預覽
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewSection.style.display = 'block';
                    analyzeBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        // 分析按鈕
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // 顯示載入狀態
            loading.classList.add('active');
            resultsSection.classList.remove('active');
            analyzeBtn.disabled = true;

            // 準備表單數據
            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                // 發送到後端
                const response = await fetch('/api/segment', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    // 顯示分割結果圖
                    segmentedImage.src = data.segmented_image;

                    // 顯示災害區域列表
                    disasterList.innerHTML = data.disaster_areas.map(area => `
                        <li class="disaster-item">
                            <div class="type">
                                ${getColorIndicator(area.color)}
                                ${area.type}
                            </div>
                            <div class="details">
                                顏色: ${area.color} | 
                                覆蓋率: ${area.percentage}%
                            </div>
                        </li>
                    `).join('');

                    // 顯示結果
                    resultsSection.classList.add('active');
                } else {
                    alert('分析失敗，請重試');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('發生錯誤: ' + error.message);
            } finally {
                loading.classList.remove('active');
                analyzeBtn.disabled = false;
            }
        });

        function getColorIndicator(colorName) {
            const colorMap = {
                '藍色': 'blue',
                '紅色': 'red',
                '黃色': 'yellow',
                '橙色': 'orange',
                '無': 'gray'
            };
            const color = colorMap[colorName] || 'gray';
            return `<span class="color-indicator" style="background: ${color};"></span>`;
        }
    </script>
</body>
</html>
